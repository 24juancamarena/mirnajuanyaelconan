<!-- Objetivo de la Practica: Muestra una tabla de filas, columnas y títulos usando TABLE, TR, TH y TD con atributos de formato -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Tablas</title>
</head>
<body>
  <p>Juan Carlos Camarena Pillado</p>
  <h2>Uso de Tablas en HTML</h2>
  <table border="2" cellspacing="10" cellpadding="5" bordercolor="#0000CC" width="50%">
    <tr>
      <th>TITULO 1</th>
      <th>TITULO 2</th>
      <th>TITULO 3</th>
    </tr>
    <tr>
      <td>Celda 1 Fila2</td>
      <td>Celda 2 Fila2</td>
      <td>Celda 3 Fila2</td>
    </tr>
    <tr>
      <td>Celda 1 Fila3</td>
      <td>Celda 2 Fila3</td>
      <td>Celda 3 Fila3</td>
      <td>Celda 4 Fila3</td>
    </tr>
    <tr>
      <td colspan="3" align="center"><img src="IMG/img1.gif" alt="Imagen de la tabla"></td>
    </tr>
  </table>
</body>
</html>
