<!-- Objetivo de la Practica: Creación básica de formularios con campo de texto, botón submit y reset usando la etiqueta FORM -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Formularios</title>
</head>
<body>
  <p>Juan Carlos Camarena Pillado</p>
  <h1>Formularios</h1>
  <form action="mailto:unaprueba" method="post">
    Ingrese su nombre:
    <input type="text" name="nombre"><br><br>
    <input type="submit" value="Enviar">
    <input type="reset" value="Restablecer">
  </form>
</body>
</html>
