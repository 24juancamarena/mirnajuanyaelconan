<!-- Practica - Celdas Diferentes -->
<!-- Juan Carlos Camarena Pillado -->
<!-- Objetivo de la Practica: Crear una tabla con celdas de tamaños diferentes utilizando atributos ROWSPAN y COLSPAN -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Celdas diferentes</title>
</head>
<body>
  <p>Juan Carlos Camarena Pillado</p>
  <h2>Tabla con celdas de tama&ntilde;os diferentes</h2>
  <table bgcolor="#33FFCC" border="2" cellspacing="10" cellpadding="5" bordercolor="#0000CC" width="50%">
    <tr>
      <th rowspan="2">A</th>
      <th colspan="2">B</th>
      <th rowspan="2" colspan="2" align="center" valign="bottom">C</th>
    </tr>
    <tr>
      <td>D</td>
      <td>E</td>
    </tr>
    <tr>
      <td colspan="3">F</td>
      <td>G</td>
      <td>H</td>
    </tr>
    <tr>
      <td colspan="5" align="center">I</td>
    </tr>
    <tr>
      <td colspan="2">J</td>
      <td colspan="3">K</td>
    </tr>
  </table>
</body>
</html>
