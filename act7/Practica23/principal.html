<!-- Objetivo: Dividir la pantalla del navegador en secciones (encabezado, menú y contenido) con FRAMESET y FRAME, para mostrar un índice que carga páginas en el área de contenido -->
<html>
<head><meta charset="UTF-8"><title>Marcos</title></head>
<frameset rows="120,*">
  <frame name="encabezado" src="encabezado.htm">
  <frameset cols="180,*">
    <frame name="menu" src="menu.htm">
    <frame name="contenido" src="contenido.htm">
  </frameset>
</frameset>
</html>
