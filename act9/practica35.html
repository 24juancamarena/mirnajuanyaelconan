<!-- Objetivo de la Practica: Definir en la sección STYLE reglas distintas para varias etiquetas (H1, H2 y H3) usando selectores de etiqueta -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Nivel Etiqueta</title>
  <style>
    h1 { color:#ff0000; }
    h2 { color:#00ff00; }
    h3 { color:#0000ff; }
  </style>
</head>
<body>
  <p>Juan Carlos Camarena Pillado</p>
  <h1>rojo</h1>
  <h2>verde</h2>
  <h3>azul</h3>
</body>
</html>
