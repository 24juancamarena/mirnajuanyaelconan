<!-- Juan Carlos Camarena Pillado -->
<!-- Objetivo de la Practica: Aplicar las propiedades del texto font-family, font-size, font-style, font-weight y font-variant con CSS -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Propiedades del texto</title>
  <style>
    h1 {
      font-family: "Times New Roman", serif;
      font-size: 30px;
      font-style: italic;
      font-weight: bold;
    }
    h2 {
      font-family: verdana;
      font-size: 20px;
    }
    p.pequenas { font-variant: small-caps; }
    p.oblicua  { font-style: oblique; }
  </style>
</head>
<body>
  <p>Juan Carlos Camarena Pillado</p>
  <h1>T&iacute;tulo de nivel 1</h1>
  <h2>T&iacute;tulo de nivel 2</h2>
  <p class="pequenas">Este p&aacute;rrafo usa font-variant: small-caps.</p>
  <p class="oblicua">Este p&aacute;rrafo usa font-style: oblique.</p>
</body>
</html>
