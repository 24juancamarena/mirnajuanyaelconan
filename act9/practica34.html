  <style>
    h1 { color:#ff0000; background-color:#ffff00; }
  </style>
</head>
<body>
  <p>Juan Carlos Camarena Pillado</p>
  <h1>Primer t&iacute;tulo</h1>
  <h1>Segundo t&iacute;tulo</h1>
  <h1>Tercer t&iacute;tulo</h1>
</body>
</html>
