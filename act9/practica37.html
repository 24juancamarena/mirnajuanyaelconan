<!-- Objetivo de la Practica: Agrupar varias etiquetas HTML con una misma regla de estilo separando los selectores con comas -->

<html lang="es">
<head>

  <title>Agrupa Etiquetas</title>
  <style>
    h1, h2, h3 {
      font-family: verdana;
      color: #0000ff;
    }
  </style>
</head>
<body>
  <p>Juan Carlos Camarena Pillado</p>
  <h1>T&iacute;tulo de nivel 1</h1>
  <h2>T&iacute;tulo de nivel 2</h2>
  <h3>T&iacute;tulo de nivel 3</h3>
</body>
</html>
